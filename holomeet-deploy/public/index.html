<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoloMeet – Anonymous 3D Meetings</title>
<style>
:root{color-scheme:dark;--bg:#04070f;--fg:#d8f6ff;--ac:#00e5ff;--mut:#7fa3b3;--pn:rgba(8,20,36,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:var(--pn);border:1px solid rgba(0,229,255,.35);border-radius:12px;backdrop-filter:blur(8px)}
button{background:rgba(0,229,255,.12);color:var(--fg);border:1px solid rgba(0,229,255,.5);border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit}
button:hover,button.on{background:rgba(0,229,255,.35)}
input[type=text]{background:#06121f;color:var(--fg);border:1px solid rgba(0,229,255,.4);border-radius:8px;padding:8px;font:inherit;width:100%}
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a2236,#04070f 70%);z-index:10;padding:16px;overflow:auto}
#lobby .panel{max-width:440px;width:100%;padding:22px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:3px;color:var(--ac);text-shadow:0 0 14px var(--ac)}
.sub{color:var(--mut);margin:0 0 16px}label{display:block;margin:12px 0 6px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}.sw.on{border-color:#fff}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud>*{pointer-events:auto}
#top{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px}
#chat{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 20px));padding:8px}
#log{height:110px;overflow:auto;font-size:13px;margin-bottom:6px}#log div{margin:2px 0}#log b{color:var(--ac)}
#tools{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px;display:flex;flex-direction:column;gap:6px}
#hint{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:var(--mut);font-size:12px;text-align:center;pointer-events:none!important}
#meter{width:60px;height:6px;background:#06121f;border-radius:3px;overflow:hidden}#meter i{display:block;height:100%;width:0;background:var(--ac)}
</style></head><body>
<canvas id="c"></canvas>
<div id="lobby"><div class="panel">
<h1>HOLOMEET</h1><p class="sub">Zero-login · anonymous · ephemeral 3D meetings</p>
<label>Temporary session ID</label><input type="text" id="nm" maxlength="16">
<label>Hologram shape</label><div class="row" id="shapes"></div>
<label>Glow colour</label><div class="row" id="cols"></div>
<label>Room (share this link or open it in a second tab)</label><input type="text" id="room" maxlength="20">
<label>Options</label>
<div class="row"><button id="micb">🎙 Enable mic test</button><div id="meter"><i></i></div></div>
<div class="row" style="margin-top:8px"><label style="margin:0;display:flex;gap:6px;align-items:center;text-transform:none"><input type="checkbox" id="bots" checked> Demo guests</label></div>
<button id="enter" style="width:100%;margin-top:18px;padding:12px;font-size:16px">ENTER ROOM →</button>
<p class="sub" style="margin:12px 0 0;font-size:12px">Nothing is stored. Everything lives in memory and vanishes when the last person leaves.</p>
</div></div>
<div id="hud">
<div id="top" class="panel"><b style="color:var(--ac)">HOLOMEET</b><span id="rn"></span><span id="cnt"></span><span style="flex:1"></span><button id="copy">🔗 Copy link</button><button id="leave">Leave</button></div>
<div id="hint">WASD / arrows to move · drag to look · toggle ✏ Draw to sketch on the glass board</div>
<div id="chat" class="panel"><div id="log"></div><input type="text" id="msg" placeholder="Message, press Enter"></div>
<div id="tools" class="panel"><button id="draw">✏ Draw</button><button id="clr">🧽 Clear board</button><button id="e1">👍</button><button id="e2">✋</button><button id="e3">❤️</button><button id="mic">🎙 Mic</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const COLS=['#00e5ff','#ff4fd8','#8aff4f','#ffb347','#9b7bff'];
const SHAPES=['◆ Crystal','⬢ Orb','☺ Bust'];
let shape=0,col=COLS[0],me=null,micOn=false,analyser=null,level=0,drawMode=false;
const id=Math.random().toString(36).slice(2,8);
$('#nm').value='Ghost-'+Math.random().toString(36).slice(2,6).toUpperCase();
$('#room').value=location.hash.slice(1)||'holo-'+Math.random().toString(36).slice(2,6);
SHAPES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s;if(!i)b.className='on';b.onclick=()=>{shape=i;[...$('#shapes').children].forEach(x=>x.className='');b.className='on'};$('#shapes').append(b)});
COLS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.onclick=()=>{col=c;[...$('#cols').children].forEach(x=>x.className='sw');b.className='sw on'};$('#cols').append(b)});

// mic
async function toggleMic(){
  if(micOn){micOn=false;analyser=null;return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new AudioContext();const src=ac.createMediaStreamSource(s);analyser=ac.createAnalyser();analyser.fftSize=256;src.connect(analyser);micOn=true}
  catch(e){alert('Microphone unavailable. You can still chat and draw.')}
}
$('#micb').onclick=async()=>{await toggleMic();$('#micb').classList.toggle('on',micOn)};
$('#mic').onclick=async()=>{await toggleMic();$('#mic').classList.toggle('on',micOn)};
const buf=new Uint8Array(128);
function readLevel(){if(!analyser){level*=.9;return}analyser.getByteFrequencyData(buf);let s=0;for(const v of buf)s+=v;level=Math.min(1,s/buf.length/60)}

// three
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x04070f);scene.fog=new THREE.FogExp2(0x04070f,.045);
const cam=new THREE.PerspectiveCamera(70,1,.1,100);cam.rotation.order='YXZ';
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const grid=new THREE.GridHelper(24,24,0x00e5ff,0x0a3a4a);scene.add(grid);
const floor=new THREE.Mesh(new THREE.CircleGeometry(12,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x061424}));floor.position.y=-.01;scene.add(floor);
const table=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,.1,48),new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:.5}));table.position.y=.8;scene.add(table);
for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const p=new THREE.Mesh(new THREE.BoxGeometry(.12,6,.12),new THREE.MeshBasicMaterial({color:0x0a5a70}));p.position.set(Math.cos(a)*11,3,Math.sin(a)*11);scene.add(p)}
// whiteboard
const bc=document.createElement('canvas');bc.width=1024;bc.height=576;const bx=bc.getContext('2d');
function clearBoard(){bx.fillStyle='rgba(10,40,60,1)';bx.fillRect(0,0,1024,576);bx.strokeStyle='rgba(0,229,255,.5)';bx.lineWidth=6;bx.strokeRect(3,3,1018,570);bx.fillStyle='rgba(0,229,255,.5)';bx.font='22px sans-serif';bx.fillText('Collaborative glass board',20,40);btex.needsUpdate=true}
const btex=new THREE.CanvasTexture(bc);
const board=new THREE.Mesh(new THREE.PlaneGeometry(6,3.375),new THREE.MeshBasicMaterial({map:btex,transparent:true,opacity:.9}));board.position.set(0,2.2,-8);scene.add(board);clearBoard();
const screen=new THREE.Mesh(new THREE.PlaneGeometry(4,2.25),new THREE.MeshBasicMaterial({color:0x102a44,wireframe:true}));screen.position.set(8,2.2,0);screen.rotation.y=-Math.PI/2;scene.add(screen);
function drawSeg(a,b,c){bx.strokeStyle=c;bx.lineWidth=5;bx.lineCap='round';bx.beginPath();bx.moveTo(a[0]*1024,a[1]*576);bx.lineTo(b[0]*1024,b[1]*576);bx.stroke();btex.needsUpdate=true}

// hologram
const mats=[];
function holoMat(color){const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
uniforms:{time:{value:0},color:{value:new THREE.Color(color)},glow:{value:0}},
vertexShader:'varying vec3 vN;varying vec3 vV;varying float vY;void main(){vec4 w=modelMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vec4 mv=viewMatrix*w;vV=normalize(-mv.xyz);vY=w.y;gl_Position=projectionMatrix*mv;}',
fragmentShader:'uniform float time;uniform vec3 color;uniform float glow;varying vec3 vN;varying vec3 vV;varying float vY;void main(){float f=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.5);float s=.55+.45*sin(vY*70.-time*3.);float fl=.9+.1*sin(time*40.)*sin(time*7.);gl_FragColor=vec4(color*(.5+f*1.6+glow*1.5),(.22+f*.8+glow*.4)*s*fl);}'});mats.push(m);return m}
function label(t,c){const k=document.createElement('canvas');k.width=256;k.height=64;const x=k.getContext('2d');x.font='bold 30px sans-serif';x.fillStyle=c;x.textAlign='center';x.fillText(t,128,42);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),transparent:true,depthWrite:false}));s.scale.set(1.4,.35,1);return s}
function makeAvatar(name,shp,color){
  const g=new THREE.Group(),m=holoMat(color);
  if(shp===0)g.add(new THREE.Mesh(new THREE.OctahedronGeometry(.4),m).translateY(1.5));
  else if(shp===1)g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(.4,1),m).translateY(1.5));
  else{g.add(new THREE.Mesh(new THREE.SphereGeometry(.26,20,16),m).translateY(1.7));g.add(new THREE.Mesh(new THREE.CylinderGeometry(.18,.4,.55,20),m).translateY(1.15))}
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.02,8,40).rotateX(Math.PI/2),m);ring.position.y=.05;g.add(ring);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,1.1,24,1,true),m);beam.position.y=.55;g.add(beam);
  const l=label(name,color);l.position.y=2.35;g.add(l);
  g.userData={m,emotes:[]};scene.add(g);return g}
function emote(g,ch){const k=document.createElement('canvas');k.width=k.height=96;const x=k.getContext('2d');x.font='70px serif';x.textAlign='center';x.fillText(ch,48,72);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),transparent:true}));s.scale.set(.6,.6,1);s.position.y=2.6;g.add(s);g.userData.emotes.push({s,t:0})}

// peers + networking (BroadcastChannel: works across tabs of this browser)
const peers={};let bc2=null;
function send(o){if(bc2)bc2.postMessage(Object.assign({id},o))}
function addLog(n,t,c){const d=document.createElement('div');const b=document.createElement('b');b.textContent=n+': ';b.style.color=c||'';d.append(b,document.createTextNode(t));$('#log').append(d);$('#log').scrollTop=1e9}
function onMsg(m){
  if(m.id===id)return;
  if(m.t==='bye'){if(peers[m.id]){scene.remove(peers[m.id].g);delete peers[m.id]}return}
  let p=peers[m.id];
  if(!p&&m.t==='state'){p=peers[m.id]={g:makeAvatar(m.name,m.shape,m.color),x:m.x,z:m.z,yaw:m.yaw,seen:0,name:m.name,color:m.color};p.g.position.set(m.x,0,m.z);addLog('system',m.name+' joined','#7fa3b3')}
  if(!p)return;p.seen=performance.now();
  if(m.t==='state'){p.x=m.x;p.z=m.z;p.yaw=m.yaw;p.g.userData.m.uniforms.glow.value=m.lvl||0}
  else if(m.t==='chat')addLog(p.name,m.text,p.color);
  else if(m.t==='emote')emote(p.g,m.ch);
  else if(m.t==='draw')drawSeg(m.a,m.b,p.color);
  else if(m.t==='clear')clearBoard();
}
// bots
const bots=[];
function spawnBots(){[['Echo-7','#ff4fd8',1],['Nova-2','#8aff4f',2]].forEach(([n,c,s],i)=>{const g=makeAvatar(n,s,c);bots.push({g,tx:0,tz:0,t:0,sp:0});g.position.set(i?-3:3,0,2)})}
const sayings=['Welcome to the room 👋','No accounts, no tracking.','Try the glass board!','Your ID vanishes when you leave.'];
// input
const keys={};addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT')keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let yaw=0,pitch=0,px=0,pz=5,dragging=false,last=null,lx=0,ly=0;
const cv=$('#c'),ray=new THREE.Raycaster();
function boardPt(e){const r=cv.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);const h=ray.intersectObject(board)[0];return h?[h.uv.x,1-h.uv.y]:null}
cv.addEventListener('pointerdown',e=>{if(!me)return;dragging=true;lx=e.clientX;ly=e.clientY;last=drawMode?boardPt(e):null;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>{dragging=false;last=null});
cv.addEventListener('pointermove',e=>{if(!dragging||!me)return;
  if(drawMode){const p=boardPt(e);if(p&&last){drawSeg(last,p,me.color);send({t:'draw',a:last,b:p})}last=p}
  else{yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}});
$('#draw').onclick=()=>{drawMode=!drawMode;$('#draw').classList.toggle('on',drawMode);if(drawMode){px=0;pz=-4.5;yaw=0;pitch=.1}};
$('#clr').onclick=()=>{clearBoard();send({t:'clear'})};
[['#e1','👍'],['#e2','✋'],['#e3','❤️']].forEach(([s,ch])=>$(s).onclick=()=>{emote(me.g,ch);send({t:'emote',ch})});
$('#msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){const t=e.target.value.trim();addLog(me.name,t,me.color);send({t:'chat',text:t});e.target.value=''}});
$('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href.split('#')[0]+'#'+me.room);$('#copy').textContent='✓ Copied';setTimeout(()=>$('#copy').textContent='🔗 Copy link',1500)};
$('#leave').onclick=()=>{send({t:'bye'});location.reload()};
addEventListener('beforeunload',()=>send({t:'bye'}));

$('#enter').onclick=()=>{
  const name=$('#nm').value.trim()||'Ghost';const room=($('#room').value.trim()||'holo-lobby').replace(/[^\w-]/g,'');
  try{location.hash=room}catch(e){}
  me={name,room,color:col,shape,g:makeAvatar(name,shape,col)};me.g.visible=false;
  try{bc2=new BroadcastChannel('holomeet-'+room);bc2.onmessage=e=>onMsg(e.data)}catch(e){}
  if($('#bots').checked)spawnBots();
  $('#lobby').style.display='none';$('#hud').style.display='block';$('#rn').textContent='/room/'+room;
  addLog('system','Welcome, '+name+'. Open this link in another tab to meet yourself.','#7fa3b3');
  setInterval(()=>send({t:'state',name,shape,color:col,x:px,z:pz,yaw,lvl:level}),100);
};
// lobby meter
setInterval(()=>{readLevel();$('#meter i').style.width=Math.round(level*100)+'%'},80);

let T0=performance.now(),lastT=T0,say=0;
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const t=(now-T0)/1000;
  mats.forEach(m=>m.uniforms.time.value=t);
  if(!me){cam.position.set(Math.cos(t*.15)*8,2.5,Math.sin(t*.15)*8);cam.lookAt(0,1.2,0);R.render(scene,cam);return}
  readLevel();
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d?1:0)-(keys.a?1:0);
  if(keys.arrowleft)yaw+=dt*1.8;if(keys.arrowright)yaw-=dt*1.8;
  px+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*dt*3.5;pz+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*dt*3.5;
  px=Math.max(-9,Math.min(9,px));pz=Math.max(-9,Math.min(9,pz));
  cam.position.set(px,1.6,pz);cam.rotation.set(pitch,yaw,0);
  me.g.position.set(px,0,pz);me.g.rotation.y=yaw;me.g.userData.m.uniforms.glow.value=level;
  const now2=performance.now();let n=1+bots.length;
  for(const k in peers){const p=peers[k];if(now2-p.seen>2500){scene.remove(p.g);delete peers[k];continue}n++;
    p.g.position.x+=(p.x-p.g.position.x)*.2;p.g.position.z+=(p.z-p.g.position.z)*.2;p.g.rotation.y=p.yaw}
  bots.forEach((b,i)=>{b.t-=dt;if(b.t<=0){b.t=3+Math.random()*4;b.tx=(Math.random()-.5)*10;b.tz=(Math.random()-.5)*8}
    const dx=b.tx-b.g.position.x,dz=b.tz-b.g.position.z,d=Math.hypot(dx,dz);if(d>.1){b.g.position.x+=dx/d*dt*.8;b.g.position.z+=dz/d*dt*.8;b.g.rotation.y=Math.atan2(-dx,-dz)}
    b.sp=Math.max(0,b.sp-dt);b.g.userData.m.uniforms.glow.value=b.sp>0?.4+.3*Math.sin(t*14):0});
  say-=dt;if(say<=0&&bots.length){say=9+Math.random()*6;const b=bots[Math.random()*bots.length|0];b.sp=2.5;addLog(b.g.children[b.g.children.length-1]?'Guest':'Guest',sayings[Math.random()*sayings.length|0],'#8aff4f');emote(b.g,'💬')}
  [me,...Object.values(peers),...bots].forEach(o=>{const g=o.g;g.children[g.children.length-1]&&0;
    g.userData.emotes=g.userData.emotes.filter(e=>{e.t+=dt;e.s.position.y=2.6+e.t*.5;e.s.material.opacity=Math.max(0,1-e.t/2);if(e.t>2){g.remove(e.s);return false}return true})});
  $('#cnt').textContent='👥 '+n+' in room';
  R.render(scene,cam)}
R.xr.enabled=true;R.setAnimationLoop(loop);
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="extra.js"></script></body></html>
