<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HoloMeet – Sign in</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><div class="card"><h1>HoloMeet</h1><p class="mut">Video meetings with 3D holographic rooms.</p>
<div class="row" id="tabs" style="margin-bottom:10px"><button class="g" data-m="login">Sign in</button><button class="g" data-m="signup">Sign up</button><button class="g" data-m="guest">Guest</button></div>
<input id="name" placeholder="Your name" autocomplete="name"><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
<div class="err" id="err"></div><button id="go" style="width:100%">Continue</button></div>
<p class="mut" style="text-align:center">No account needed: choose Guest to jump in.</p></div>
<script>
const $=s=>document.querySelector(s);let mode='login';
try{const u=JSON.parse(localStorage.getItem('hm_user')||'null');if(u&&u.exp>Date.now()&&localStorage.getItem('hm_token'))location.replace('home.html')}catch(e){}
function setMode(m){mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('#name').hidden=m==='login';$('#email').hidden=$('#pw').hidden=m==='guest';$('#err').textContent='';$('#go').textContent={login:'Sign in',signup:'Create account',guest:'Join as guest'}[m]}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode('login');
$('#go').onclick=async()=>{try{const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#pw').value})});
 const d=await r.json();if(!r.ok){$('#err').textContent=d.error||'Something went wrong';return}
 localStorage.setItem('hm_token',d.token);localStorage.setItem('hm_user',JSON.stringify(d.user));location='home.html'}catch(e){$('#err').textContent='Cannot reach the server.'}};
document.addEventListener('keydown',e=>e.key==='Enter'&&$('#go').click());
</script></body></html>
