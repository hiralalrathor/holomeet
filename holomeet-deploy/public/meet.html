<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HoloMeet – Meeting</title><link rel="stylesheet" href="style.css">
<style>
body{height:100vh;overflow:hidden}#pre{max-width:560px;margin:4vh auto;padding:0 16px;text-align:center}
video{width:100%;background:#000;display:block;object-fit:cover}#pv{border-radius:14px;aspect-ratio:16/9;transform:scaleX(-1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0}.chips button{padding:7px 11px;font-size:13px}
#call{display:flex;height:100vh}#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{padding:8px 14px;display:flex;gap:10px;align-items:center}#grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));grid-auto-rows:minmax(0,1fr);gap:8px;padding:8px;overflow:auto}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:140px}.tile video{height:100%}.tile.me video{transform:scaleX(-1)}.tile.scr video{object-fit:contain}
.nm{position:absolute;left:8px;bottom:8px;background:#0009;padding:2px 8px;border-radius:6px;font-size:13px}.ic{position:absolute;right:8px;bottom:8px;font-size:18px}
.av{display:none;position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:#5f6368;font-size:38px;align-items:center;justify-content:center}.off .av{display:flex}.off video{opacity:0}
#bar{display:flex;gap:8px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}#bar button{background:#3c4043;color:var(--fg);min-width:54px}#bar button.off{background:var(--red);color:#fff}#bar button.on{background:var(--ac);color:#0b1b34;outline:0}
#side{width:300px;background:var(--card);display:flex;flex-direction:column;padding:10px}#log{flex:1;overflow:auto}#log div{margin:6px 0;word-break:break-word}#log b{color:var(--ac)}
#fxp{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--card);padding:10px;border-radius:12px;max-width:94vw;z-index:5}
.pop{position:fixed;bottom:76px;right:14px;background:var(--card);padding:12px;border-radius:12px;z-index:5;min-width:220px;display:flex;flex-direction:column;gap:6px}#rx{flex-direction:row;flex-wrap:wrap;min-width:0}
.tile{cursor:pointer}.tile.spk{outline:3px solid var(--ac)}.tile.pin{grid-column:1/-1}
.fl{position:absolute;bottom:30px;font-size:34px;animation:up 2.2s ease-out forwards;pointer-events:none}@keyframes up{to{transform:translateY(-140px);opacity:0}}
#cap{display:none;position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:8px;max-width:90vw;z-index:4}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}
@media(max-width:700px){#side{position:fixed;inset:0;width:auto;z-index:6}}
</style></head><body>
<div id="pre"><h1>Ready to join?</h1><p class="mut">Meeting <b id="pcode"></b></p><video id="pv" autoplay muted playsinline></video>
<div class="row" style="margin:10px 0"><button class="g mic">🎙 Mic on</button><button class="g cam">📷 Camera on</button></div>
<p class="mut" style="margin:6px 0">Background</p><div class="chips" id="c1"></div><div class="mut" id="msg"></div>
<div class="row"><button id="join">Join now</button><button class="g" onclick="location='home.html'">Back</button></div></div>
<div id="call" hidden><div id="main"><div id="top"><b id="ccode"></b><button class="g" id="copy">📋 Copy link</button><span class="mut" id="cnt"></span></div><div id="grid"></div>
<div id="bar"><button class="mic">🎙</button><button class="cam">📷</button><button id="bShare">🖥 Present</button><button id="bHand">✋</button><button id="bFx">✨ Effects</button><button id="bRx">😊</button><button id="bCc">CC</button><button id="bRec">⏺ Record</button><button id="bPpl">👥</button><button id="bChat">💬</button><button id="bLeave" class="off">Leave</button></div></div>
<div id="side" hidden><div id="log"></div><input id="ci" placeholder="Send a message" maxlength="500"></div></div>
<div id="rx" class="pop" hidden></div><div id="ppl" class="pop" hidden></div><div id="cap"></div><div id="toast"></div>
<div id="fxp" hidden><div class="chips" id="c2"></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
let U=null;const T=localStorage.getItem('hm_token');try{U=JSON.parse(localStorage.getItem('hm_user'))}catch(e){}
const code=(new URLSearchParams(location.search).get('r')||'').toLowerCase();
if(!U||!T||U.exp<Date.now())location.replace('index.html');else if(!/^[a-z0-9-]{3,24}$/.test(code))location.replace('home.html');
$('#pcode').textContent=$('#ccode').textContent=code;
let cam=null,mic=null,camOn=true,micOn=true,hand=false,curV=null,screenTrack=null,socket,joined=false,ice=[{urls:'stun:stun.l.google.com:19302'}];
const pcs={},tiles={},names={};
// ---------- local media + background effects ----------
const cv=document.createElement('canvas'),tc=document.createElement('canvas');cv.width=tc.width=640;cv.height=tc.height=360;
const cx=cv.getContext('2d',{willReadFrequently:true}),tx=tc.getContext('2d',{willReadFrequently:true});
const src=document.createElement('video');src.muted=true;src.playsInline=true;
let seg=null,fxTrack=null,loopOn=false,bg='none',bgImg=null;
const PRE={Sunset:['#ff7e5f','#feb47b'],Ocean:['#2193b0','#6dd5ed'],Night:['#0f0c29','#4a3f9f']};
const preset=a=>{const c=document.createElement('canvas');c.width=640;c.height=360;const g=c.getContext('2d'),l=g.createLinearGradient(0,0,640,360);l.addColorStop(0,a[0]);l.addColorStop(1,a[1]);g.fillStyle=l;g.fillRect(0,0,640,360);return c};
async function init(){
  try{const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:360},audio:{echoCancellation:true,noiseSuppression:true}});cam=s.getVideoTracks()[0];mic=s.getAudioTracks()[0];useTrack(cam)}
  catch(e){$('#msg').textContent='Camera or microphone blocked: you can still join and chat.'}
  refresh()}
function useTrack(t){curV=t;[$('#pv'),tiles.me&&tiles.me.v].forEach(v=>v&&(v.srcObject=new MediaStream(t?[t]:[])));Object.values(pcs).forEach(p=>p.cv&&p.cv.replaceTrack(t).catch(()=>{}))}
async function loadSeg(){const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',{ImageSegmenter,FilesetResolver}=await import(V+'/+esm');
  seg=await ImageSegmenter.createFromOptions(await FilesetResolver.forVisionTasks(V+'/wasm'),{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite'},runningMode:'VIDEO',outputConfidenceMasks:true,outputCategoryMask:false})}
async function setBg(k,img){
  $$('.chips button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  if(k==='None'){bg='none';loopOn=false;return useTrack(cam)}
  if(!cam)return;
  if(!seg){$('#msg').textContent='Loading effects…';try{await loadSeg()}catch(e){$('#msg').textContent='';alert('Effects unavailable: '+e.message);return setBg('None')}$('#msg').textContent=''}
  bg=k==='Blur'?'blur':'img';bgImg=img||null;src.srcObject=new MediaStream([cam]);await src.play();
  if(!fxTrack)fxTrack=cv.captureStream(24).getVideoTracks()[0];fxTrack.enabled=camOn;
  if(!loopOn){loopOn=true;tick()}useTrack(fxTrack)}
function tick(){
  if(!loopOn)return;
  try{if(src.readyState>=2){const r=seg.segmentForVideo(src,performance.now()),ms=r.confidenceMasks,single=ms.length<2,m=single?ms[0]:ms[1],mk=m.getAsFloat32Array(),mw=m.width,mh=m.height;
    const inv=single&&(mk[0]+mk[mw-1]+mk[(mh-1)*mw]+mk[mh*mw-1])/4>.5;
    if(bg==='blur'){tx.drawImage(src,0,0,64,36);cx.drawImage(tc,0,0,64,36,0,0,640,360)}
    else if(bgImg){const s=Math.max(640/bgImg.width,360/bgImg.height);cx.drawImage(bgImg,(640-bgImg.width*s)/2,(360-bgImg.height*s)/2,bgImg.width*s,bgImg.height*s)}
    tx.clearRect(0,0,640,360);tx.drawImage(src,0,0,640,360);const d=tx.getImageData(0,0,640,360),a=d.data;
    for(let y=0;y<360;y++){const ro=((y*mh/360)|0)*mw;for(let x=0;x<640;x++){let p=mk[ro+((x*mw/640)|0)];if(inv)p=1-p;a[(y*640+x)*4+3]=p<.3?0:p>.7?255:(p-.3)*637}}
    tx.putImageData(d,0,0);cx.drawImage(tc,0,0);r.close()}}catch(e){console.warn(e)}
  setTimeout(tick,40)}
function chips(el){['None','Blur','Sunset','Ocean','Night','Upload'].forEach(k=>{const b=document.createElement('button');b.className='g';b.dataset.k=k;b.textContent=({None:'🚫 None',Blur:'🌫 Blur',Upload:'🖼 Upload'})[k]||k;
  b.onclick=()=>{if(k==='Upload'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const i=new Image();i.onload=()=>setBg('Upload',i);i.src=URL.createObjectURL(f.files[0])};f.click()}
   else setBg(k,PRE[k]&&preset(PRE[k]))};el.append(b)})}
chips($('#c1'));chips($('#c2'));$$('.chips button[data-k=None]').forEach(b=>b.classList.add('on'));
function refresh(){$$('.mic').forEach(b=>{b.textContent=micOn?'🎙 Mic on':'🔇 Mic off';b.classList.toggle('off',!micOn)});$$('.cam').forEach(b=>{b.textContent=camOn?'📷 Camera on':'🚫 Camera off';b.classList.toggle('off',!camOn)});
  if(tiles.me){tiles.me.d.classList.toggle('off',!camOn);tiles.me.ic.textContent=(micOn?'':'🔇')+(hand?'✋':'')}$('#bHand').classList.toggle('on',hand)}
$$('.mic').forEach(b=>b.onclick=()=>{micOn=!micOn;if(mic)mic.enabled=micOn;refresh();sendState()});
$$('.cam').forEach(b=>b.onclick=()=>{camOn=!camOn;if(cam)cam.enabled=camOn;if(fxTrack)fxTrack.enabled=camOn;refresh();sendState()});
$('#bHand').onclick=()=>{hand=!hand;refresh();sendState()};
$('#bFx').onclick=()=>{$('#fxp').hidden=!$('#fxp').hidden};$('#bChat').onclick=()=>{$('#side').hidden=!$('#side').hidden};
// ---------- tiles ----------
function tile(id,name,cls){if(tiles[id])return tiles[id];const d=document.createElement('div');d.className='tile '+(cls||'');d.innerHTML='<video autoplay playsinline></video><b class="av"></b><span class="nm"></span><span class="ic"></span>';
  d.querySelector('.nm').textContent=name;d.querySelector('.av').textContent=(name||'?')[0].toUpperCase();d.onclick=()=>{const was=d.classList.contains('pin');$$('.tile.pin').forEach(x=>x.classList.remove('pin'));if(!was)d.classList.add('pin')};$('#grid').append(d);
  tiles[id]={d,v:d.querySelector('video'),ic:d.querySelector('.ic')};count();return tiles[id]}
function drop(id){if(tiles[id]){tiles[id].d.remove();delete tiles[id]}count()}
const count=()=>$('#cnt').textContent=Object.keys(tiles).filter(k=>!k.endsWith('-s')).length+' in meeting';
// ---------- WebRTC mesh ----------
function bind(pc){const t=pc.getTransceivers();t.forEach(x=>x.direction='sendrecv');pc.sa=t[0].sender;pc.cv=t[1].sender;pc.sv=t[2].sender;
  if(mic)pc.sa.replaceTrack(mic);if(curV)pc.cv.replaceTrack(curV);if(screenTrack)pc.sv.replaceTrack(screenTrack)}
function mk(pid){if(pcs[pid])pcs[pid].close();const pc=new RTCPeerConnection({iceServers:ice});pcs[pid]=pc;pc.q=[];const name=names[pid]||'Guest',t=tile(pid,name);t.stream=new MediaStream();t.v.srcObject=t.stream;
  pc.onicecandidate=e=>e.candidate&&socket.emit('vsig',{to:pid,data:{c:e.candidate}});
  pc.ontrack=e=>{const i=pc.getTransceivers().indexOf(e.transceiver);
    if(i===2){const st=new MediaStream([e.track]);e.track.onunmute=()=>{const s=tile(pid+'-s',name+' (presenting)','scr');s.v.srcObject=st};e.track.onmute=()=>drop(pid+'-s')}
    else{t.stream.addTrack(e.track);if(e.track.kind==='audio')watch(new MediaStream([e.track]),pid)}};return pc}
async function call(pid){const pc=mk(pid);['audio','video','video'].forEach(k=>pc.addTransceiver(k));bind(pc);await pc.setLocalDescription(await pc.createOffer());socket.emit('vsig',{to:pid,data:{sdp:pc.localDescription}})}
async function onSig({from,data}){let pc=pcs[from];
  if(data.sdp){if(data.sdp.type==='offer'){pc=mk(from);await pc.setRemoteDescription(data.sdp);bind(pc);await pc.setLocalDescription(await pc.createAnswer());socket.emit('vsig',{to:from,data:{sdp:pc.localDescription}})}
    else if(pc)await pc.setRemoteDescription(data.sdp);if(pc)for(const c of pc.q.splice(0))pc.addIceCandidate(c).catch(()=>{})}
  else if(data.c&&pc){if(pc.remoteDescription)pc.addIceCandidate(data.c).catch(()=>{});else pc.q.push(data.c)}}
const sendState=()=>socket&&joined&&socket.emit('vstate',{mic:micOn,cam:camOn,hand});
function addLog(n,t){const d=document.createElement('div'),b=document.createElement('b');b.textContent=n+': ';d.append(b,document.createTextNode(t));$('#log').append(d);$('#log').scrollTop=1e9}
$('#join').onclick=()=>{
  socket=io();extra();socket.on('connect',()=>{if(joined)location.reload();else socket.emit('vjoin',{token:T,code})});
  socket.on('verr',m=>{alert(m);location='home.html'});
  socket.on('vready',async d=>{joined=true;ice=d.ice;$('#pre').hidden=true;$('#call').hidden=false;const me=tile('me',U.name+' (You)','me');me.v.muted=true;me.v.srcObject=new MediaStream(curV?[curV]:[]);refresh();
    hostSid=d.host;mySid=d.sid;if(mic)watch(new MediaStream([mic]),'me');saveRecent();for(const p of d.peers){names[p.sid]=p.name;await call(p.sid)}renderPeople();sendState()});
  socket.on('vjoined',d=>{names[d.sid]=d.name;renderPeople();toast(d.name+' joined');sendState()});
  socket.on('vsig',onSig);
  socket.on('vleft',id=>{if(pcs[id])pcs[id].close();delete pcs[id];delete watchers[id];delete names[id];drop(id);drop(id+'-s');renderPeople()});
  socket.on('vstate',s=>{const t=tiles[s.sid];if(t){t.d.classList.toggle('off',!s.cam);t.ic.textContent=(s.mic?'':'🔇')+(s.hand?'✋':'')}});
  socket.on('vchat',m=>addLog(m.from,m.text))};
$('#ci').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){socket.emit('vchat',e.target.value);addLog('You',e.target.value);e.target.value=''}});
$('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/meet.html?r='+code);$('#copy').textContent='✓ Copied';setTimeout(()=>$('#copy').textContent='📋 Copy link',1500)};
function stopShare(){if(screenTrack)screenTrack.stop();screenTrack=null;Object.values(pcs).forEach(p=>p.sv&&p.sv.replaceTrack(null).catch(()=>{}));drop('me-s');$('#bShare').classList.remove('on')}
$('#bShare').onclick=async()=>{if(screenTrack)return stopShare();
  try{const s=await navigator.mediaDevices.getDisplayMedia({video:true});screenTrack=s.getVideoTracks()[0];screenTrack.onended=stopShare;Object.values(pcs).forEach(p=>p.sv&&p.sv.replaceTrack(screenTrack));
    const t=tile('me-s','You (presenting)','scr');t.v.muted=true;t.v.srcObject=s;$('#bShare').classList.add('on')}catch(e){}};
$('#bLeave').onclick=()=>{loopOn=false;socket&&socket.disconnect();[cam,mic,screenTrack].forEach(t=>t&&t.stop());location='home.html'};
// ---------- extras: host controls, reactions, captions, speaker highlight, recording ----------
let hostSid=null,mySid=null,ac=null,ccOn=false,rec=null,mr=null;const watchers={};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,3000)};
function watch(st,id){try{ac=ac||new AudioContext();const a=ac.createAnalyser();a.fftSize=256;ac.createMediaStreamSource(st).connect(a);watchers[id]={a,b:new Uint8Array(128)}}catch(e){}}
setInterval(()=>{for(const id in watchers){const w=watchers[id];w.a.getByteFrequencyData(w.b);let s=0;for(const v of w.b)s+=v;const t=tiles[id];if(t)t.d.classList.toggle('spk',s/128>18)}},250);
function fl(id,e){const t=tiles[id];if(!t)return;const s=document.createElement('span');s.className='fl';s.textContent=e;s.style.left=20+Math.random()*60+'%';t.d.append(s);setTimeout(()=>s.remove(),2200)}
['👍','👏','❤️','😂','🎉','😮'].forEach(e=>{const b=document.createElement('button');b.className='g';b.textContent=e;b.onclick=()=>{socket.emit('vreact',e);fl('me',e);$('#rx').hidden=true};$('#rx').append(b)});
$('#bRx').onclick=()=>{$('#rx').hidden=!$('#rx').hidden;$('#ppl').hidden=true};
function cap(n,t){const e=$('#cap');e.textContent=n+': '+t;e.style.display='block';clearTimeout(cap.t);cap.t=setTimeout(()=>e.style.display='none',5000)}
$('#bCc').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Captions need Chrome, Edge or Safari.');
  ccOn=!ccOn;$('#bCc').classList.toggle('on',ccOn);if(!ccOn){rec&&rec.stop();return}
  rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang=navigator.language||'en-US';
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim();if(t&&micOn){socket.emit('vcap',t);cap('You',t)}};
  rec.onend=()=>{if(ccOn)try{rec.start()}catch(x){}};rec.start();toast('Captions on: your speech is transcribed and shared as text')};
$('#bRec').onclick=async()=>{if(mr)return mr.stop();
  try{const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true,preferCurrentTab:true}),ch=[];mr=new MediaRecorder(s);
    mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
    mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download='holomeet-'+code+'.webm';a.click();mr=null;$('#bRec').classList.remove('off');$('#bRec').textContent='⏺ Record';toast('Recording saved to your downloads')};
    s.getVideoTracks()[0].onended=()=>mr&&mr.stop();mr.start();$('#bRec').classList.add('off');$('#bRec').textContent='⏹ Stop';
    socket.emit('vchat','🔴 started recording on their device');addLog('You','🔴 started recording on your device')}catch(e){mr=null}};
function renderPeople(){const p=$('#ppl');p.innerHTML='';const h=document.createElement('div');h.className='mut';h.textContent='People in this meeting';p.append(h);
  const row=(id,n)=>{const d=document.createElement('div');d.className='row';d.style.alignItems='center';const s=document.createElement('span');s.textContent=n+((id==='me'?mySid:id)===hostSid?' 👑':'');d.append(s);
    if(mySid===hostSid&&id!=='me'){const b=document.createElement('button');b.className='g';b.textContent='Remove';b.style.flex='0';b.onclick=()=>socket.emit('vkick',id);d.append(b)}p.append(d)};
  row('me',U.name+' (You)');Object.keys(names).forEach(id=>row(id,names[id]));
  if(mySid&&mySid===hostSid){const b=document.createElement('button');b.textContent='🔇 Mute everyone';b.onclick=()=>{socket.emit('vmuteall');toast('Everyone was muted')};p.append(b)}}
$('#bPpl').onclick=()=>{renderPeople();$('#ppl').hidden=!$('#ppl').hidden;$('#rx').hidden=true};
function extra(){socket.on('vreact',d=>fl(d.sid,d.e));socket.on('vcap',d=>ccOn&&cap(d.from,d.text));
  socket.on('vhost',s=>{hostSid=s;renderPeople();if(s===mySid)toast('You are now the host')});
  socket.on('vmute',()=>{micOn=false;if(mic)mic.enabled=false;refresh();sendState();toast('The host muted everyone')});
  socket.on('vkicked',()=>{alert('The host removed you from this meeting.');$('#bLeave').click()})}
function saveRecent(){try{const r=JSON.parse(localStorage.getItem('hm_recent')||'[]').filter(x=>x.code!==code);r.unshift({code,t:Date.now()});localStorage.setItem('hm_recent',JSON.stringify(r.slice(0,5)))}catch(e){}}
init();
</script></body></html>
